[project]
name = "aagam"
version = "0.1.0"
description = "Adaptive AI-Grid Assimilation Model — SIH 2026 PS 26081 (MoES / NCMRWF)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "AAGAM Team" }
]
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "pytz>=2024.1",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "supabase>=2.4.0",
    "asyncpg>=0.29.0",
    "groq>=0.5.0",
    "slowapi>=0.1.9",
    "orjson>=3.9.0",
]

[project.optional-dependencies]
core = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "pytz>=2024.1",
]
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic-settings>=2.2.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "groq>=0.5.0",
    "slowapi>=0.1.9",
    "orjson>=3.9.0",
    "supabase>=2.4.0",
]
pipeline = [
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "xarray>=2024.2.0",
    "pyarrow>=15.0.0",
    "scikit-learn>=1.4.0",
    "lightgbm>=4.3.0",
    "joblib>=1.3.0",
    "imdlib>=0.1.20",
    "typer>=0.12.0",
    "supabase>=2.4.0",
    "asyncpg>=0.29.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "pre-commit>=3.6.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "api/tests",
    "pipeline/tests",
]
pythonpath = ["."]
asyncio_mode = "auto"
