name: AAGAM Daily Summary Notifications

on:
  schedule:
    # Daily at 01:30 UTC / 07:00 IST (PRD §6.12, Tech Stack §12)
    - cron: '30 1 * * *'
  workflow_dispatch:

jobs:
  notify-daily-summary:
    name: Morning Daily Alert Digest for Subscribers
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Alert Summary Job
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          python -m pipeline.notify.daily_summary
