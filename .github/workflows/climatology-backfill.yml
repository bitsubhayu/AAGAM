name: AAGAM Climatology Percentiles Backfill

on:
  schedule:
    # Annual refresh on Jan 1st at 04:00 UTC (PRD §6.11, §7.6)
    - cron: '0 4 1 1 *'
  workflow_dispatch:
    inputs:
      min_years:
        description: "Minimum history guard floor"
        required: false
        default: "15"
      dry_run:
        description: "Dry run (no DB mutation)"
        required: false
        default: "false"

jobs:
  climatology-backfill:
    name: Climatology Percentiles Backfill & Refresh
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Climatology Backfill
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m pipeline climatology-backfill --min-years ${{ inputs.min_years || 15 }} ${{ (inputs.dry_run == 'true') && '--dry-run' || '' }}
