name: AAGAM Daily Forecast Verification

on:
  schedule:
    # Daily at 03:23 UTC (08:53 IST), after ECMWF / IMD ERA5 truth updates
    - cron: '23 3 * * *'
  workflow_dispatch:

jobs:
  verify:
    name: Operational Verification & Skill Scoring
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Verification Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m pipeline verify
