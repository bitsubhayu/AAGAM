name: AAGAM Scheduled Ingest & Blend

on:
  schedule:
    # 6-hourly cycle: 00Z, 06Z, 12Z, 18Z + 4-hour model availability offset
    - cron: '17 0,6,12,18 * * *'
  workflow_dispatch:

jobs:
  ingest-blend:
    name: Live Forecast Ingestion & Adaptive Blending
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Live Forecast Ingest & Blend Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m pipeline ingest-live
