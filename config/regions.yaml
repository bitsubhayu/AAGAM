# ==============================================================================
# AAGAM — Regions and Seasons Configuration (regions.yaml)
# ==============================================================================
# Maps the 5 authoritative project regions and 4 IMD meteorological seasons.
# ==============================================================================

regions:
  EAST_NE:
    name: "East & North-East India"
    description: "West Bengal, Odisha, Bihar, Jharkhand, Assam, Meghalaya, Tripura"
  SOUTH:
    name: "South Peninsula"
    description: "Tamil Nadu, Kerala, Karnataka, Andhra Pradesh, Telangana"
  CENTRAL:
    name: "Central & West Coast"
    description: "Maharashtra, Goa, Madhya Pradesh, Chhattisgarh"
  NW:
    name: "North-West India"
    description: "Delhi, Gujarat, Rajasthan, Uttar Pradesh, Punjab, Chandigarh"
  HIMALAYAN:
    name: "Himalayan Region"
    description: "Uttarakhand, Himachal Pradesh, Jammu & Kashmir, Sikkim"

seasons:
  WINTER:
    name: "Winter"
    months: [1, 2] # January, February
    description: "Cold wave monitoring, western disturbances"
  PRE_MONSOON:
    name: "Pre-Monsoon"
    months: [3, 4, 5] # March, April, May
    description: "Heatwave and convective storms"
  MONSOON:
    name: "Southwest Monsoon"
    months: [6, 7, 8, 9] # June, July, August, September
    description: "Primary rainfall season across India"
  POST_MONSOON:
    name: "Post-Monsoon"
    months: [10, 11, 12] # October, November, December
    description: "Northeast monsoon (Tamil Nadu) and cyclonic activity"
